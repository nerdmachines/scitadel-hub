name: Traceability
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tools/tests -v
      - run: tools/trace-check docs
  markdown-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: lycheeverse/lychee-action@649b0e4890508ea3e11ea6b3ee35ce899a25afd5
        with:
          # Private reference ADRs cannot be fetched with this public repo's token.
          args: >-
            --include-fragments --no-progress --max-retries 3
            --exclude '^https://github.com/nerdmachines/kit/'
            './*.md' 'docs/**/*.md'
          fail: true
